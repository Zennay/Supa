name: M3 observed-week report

on:
  pull_request:
    paths:
      - ".github/workflows/m3-observed-week-report.yml"
      - "scripts/m3-create-observation-sheet.mjs"
      - "scripts/m3-build-observed-study.mjs"
      - "scripts/m3-assess-observed-week.mjs"
      - "scripts/m3-source-output-preservation.mjs"
      - "tests/qa-m3-private-input-error-redaction.test.mjs"
      - "tests/qa-m3-output-arg-failclosed.test.mjs"
      - "tests/qa-m3-derived-output-private-directories.test.mjs"
      - "tests/qa-m3-derived-symlink-parent-guard.test.mjs"
      - "tests/qa-m3-derived-safety-path-trigger.test.mjs"
      - "tests/qa-m3-private-operator-positive-contracts.test.mjs"
      - "tests/qa-m3-attribution-root-shape.test.mjs"
      - "tests/qa-m3-attribution-guard-edge-controls.test.mjs"
      - "tests/m3-cli-source-alias-regression.test.mjs"
      - "tests/m3-cli-parent-alias-regression.test.mjs"
      - "tests/m3-cli-distinct-output-rerun.test.mjs"
      - "src/features/observation/**"
      - "tests/product-m3-observation-stale-tab-*.test.mjs"
      - "tests/product-m3-unreadable-local-draft-recovery.test.mjs"
      - "tests/qa-m3-stale-draft-*.test.mjs"
      - "tests/qa-m3-submillisecond-*.test.mjs"
      - "tests/qa-m3-subms-*.test.mjs"
      - "src/features/observation/ObservationView.tsx"
      - "src/features/observation/observationNextStep.ts"
      - "src/features/observation/observationCollectionUi.ts"
      - "src/features/observation/observationRequiredLineField.ts"
      - "tests/product-m3-observation-live-clock-20261014.test.mjs"
      - "tests/product-m3-observation-next-action-live-ssr.test.mjs"
      - "src/domain/observedBasketStudy.ts"
      - "src/domain/basket.ts"
      - "src/domain/m3ObservationSheet.ts"
      - "src/data/m2Fixture.ts"
      - "src/domain/decimalPackArithmetic.ts"
      - "src/domain/types.ts"
      - "src/domain/matching.ts"
      - "src/domain/basketComparison.ts"
      - "src/domain/savingsAttribution.ts"
      - "tests/m3-observation-sheet.test.mjs"
      - "tests/m3-build-observed-study.test.mjs"
      - "tests/m3-observed-study-report.test.mjs"
      - "tests/m3-savings-attribution.test.mjs"
      - "tests/m3-workflow-contract.test.mjs"
      - "tests/m3-workflow-transitive-trigger-closure.test.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: supa-m3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report-gate:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify permanent VPS runner
        run: test "$(hostname -s)" = "vps-bb300bba"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate M3 field-run observation sheet
        run: npm run m3:create-observation-sheet -- --output artifacts/m3/observation-sheet.json
      - name: Upload M3 field-run pack
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supa-m3-field-run-pack
          path: artifacts/m3/observation-sheet.json
          if-no-files-found: error
          retention-days: 7
      - run: node --experimental-strip-types --test tests/m3-observation-sheet.test.mjs tests/m3-build-observed-study.test.mjs tests/m3-observed-study-report.test.mjs tests/m3-savings-attribution.test.mjs tests/m3-workflow-contract.test.mjs
      - run: npm test
      - run: npm run build
