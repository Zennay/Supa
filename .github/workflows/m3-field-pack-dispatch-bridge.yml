name: One-shot M3 field-pack dispatch bridge

on:
  pull_request:
    paths:
      - ".github/workflows/m3-field-pack-dispatch-bridge.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch canonical M3 field-pack workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=data,
                  method=method,
                  headers={**headers, "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read().decode()
                  return response.status, json.loads(body) if body else None

          _, commit = request("GET", f"/repos/{repo}/commits/main")
          main_sha = commit["sha"]

          query = urllib.parse.urlencode({
              "event": "workflow_dispatch",
              "branch": "main",
              "per_page": 20,
          })
          _, runs = request(
              "GET",
              f"/repos/{repo}/actions/workflows/m3-observed-week-report.yml/runs?{query}",
          )
          existing = next(
              (
                  run for run in runs.get("workflow_runs", [])
                  if run.get("head_sha") == main_sha
                  and run.get("event") == "workflow_dispatch"
              ),
              None,
          )
          if existing:
              print(
                  "M3_FIELD_PACK_ALREADY_DISPATCHED "
                  f"main_sha={main_sha} run_id={existing['id']} status={existing['status']}"
              )
              raise SystemExit(0)

          status, _ = request(
              "POST",
              f"/repos/{repo}/actions/workflows/m3-observed-week-report.yml/dispatches",
              {"ref": "main"},
          )
          if status != 204:
              raise SystemExit(f"workflow dispatch returned HTTP {status}")

          print(f"M3_FIELD_PACK_DISPATCHED main_sha={main_sha}")
          PY
