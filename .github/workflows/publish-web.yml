name: Publish SUPA web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: supa-pages-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Zennay/Supa' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, supa, vps]
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static SUPA client under /Supa/
        run: |
          npx tsc -b
          npx vite build --base=/Supa/
          # Recipe link imports require the separate HTTPS Node server;
          # do not publish the executable server entrypoint as a static asset.
          rm -f dist/server.mjs
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
