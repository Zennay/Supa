name: VPS mobile foundation

on:
  pull_request:
    paths:
      - "src/App.tsx"
      - "src/main.tsx"
      - "src/styles.css"
      - "src/components/**"
      - "src/features/**"
      - "src/domain/planner.ts"
      - "src/domain/plannerPreferences.ts"
      - "src/domain/types.ts"
      - "src/data/mock.ts"
      - "src/lib/**"
      - "tests/planner*.test.*"

concurrency:
  group: supa-vps-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify permanent VPS runner
        run: |
          test "$(hostname -s)" = "vps-bb300bba"
          echo "runner=$(hostname -s)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
