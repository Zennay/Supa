name: VPS mobile foundation

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/vps-mobile-foundation.yml"

jobs:
  test-build:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
