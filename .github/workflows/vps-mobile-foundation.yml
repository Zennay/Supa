name: VPS mobile foundation

on:
  pull_request:
    paths:
      - ".github/workflows/vps-mobile-foundation.yml"
      - "index.html"
      - "src/App.tsx"
      - "src/main.tsx"
      - "src/styles.css"
      - "src/components/**"
      - "src/features/**"
      - "src/domain/**"
      - "src/data/mock.ts"
      - "src/data/m2Fixture.ts"
      - "src/data/m3ComparisonFixture.ts"
      - "src/lib/**"
      - "tests/mobile-safe-area-contract.test.mjs"
      - "tests/planner*.test.*"
      - "tests/m2-core-slice.test.mjs"
      - "tests/m3-*.test.mjs"
      - "scripts/m4-*.mjs"
      - "tests/m4-*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"

concurrency:
  group: supa-vps-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify permanent VPS runner
        run: |
          test "$(hostname -s)" = "vps-bb300bba"
          echo "runner=$(hostname -s)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
