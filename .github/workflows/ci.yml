name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose safe audit remediation
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only
          git diff -- package-lock.json
          exit 1
