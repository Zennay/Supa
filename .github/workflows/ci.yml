name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: supa-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run m1:matching-benchmark
      - run: npm run m1:source-permission-gate
      - run: npm run build
