name: M1 supermarket source capture

on:
  pull_request:
    paths:
      - "scripts/m1-capture-sources.mjs"
      - "scripts/m1-check-source-permission-gate.mjs"
      - "scripts/retailer-source-route-safety.mjs"
      - "scripts/retailer-offline-structural-scan.mjs"
      - "scripts/retailer-json-script-mime.mjs"
      - "scripts/retailer-private-unique-key-json.mjs"
      - "scripts/m3-source-output-preservation.mjs"
      - "evidence/m1/source-permission-gate.v1.json"
      - "tests/m1-capture-sources.test.mjs"
      - "tests/ingestion-contract.test.mjs"
      - "tests/normalization.test.mjs"
      - "tests/matching-benchmark.test.mjs"
      - "fixtures/matching/**"
      - "scripts/m1-run-matching-benchmark.mjs"
      - "scripts/m1-inspect-captures.mjs"
      - "tests/m1-inspect-captures.test.mjs"
      - "scripts/m1-export-sanitized-candidates.mjs"
      - "tests/m1-export-sanitized-candidates.test.mjs"
      - "scripts/m1-compare-captures.mjs"
      - "tests/m1-compare-captures.test.mjs"
      - "scripts/m1-evaluate-freshness.mjs"
      - "tests/m1-evaluate-freshness.test.mjs"
      - "scripts/m1-build-evidence-summary.mjs"
      - "tests/m1-build-evidence-summary.test.mjs"
      - "scripts/m1-promote-reviewed-candidates.mjs"
      - "tests/m1-promote-reviewed-candidates.test.mjs"
      - "src/data/reviewedLiveFixtures.ts"
      - "tests/reviewed-live-fixtures.test.mjs"
      - "src/data/plusRenderedProduct.ts"
      - "tests/plus-rendered-product.test.mjs"
      - "src/data/dekaMarktSsrProduct.ts"
      - "tests/dekamarkt-ssr-product.test.mjs"
      - "src/data/plusRenderedListings.ts"
      - "tests/plus-rendered-listings.test.mjs"
      - "src/data/dekaMarktSsrListings.ts"
      - "tests/dekamarkt-ssr-listings.test.mjs"
      - "tests/qa-m1-reviewed-retailer-path-contract.test.mjs"
      - "src/domain/matching.ts"
      - "package-lock.json"
      - "src/data/ingestion.ts"
      - "src/data/normalize.ts"
      - "src/data/schemaOrgProduct.ts"
      - "tests/schema-org-product.test.mjs"
      - "tests/m1-workflow-fork-safety-contract.test.mjs"
      - "tests/m1-workflow-transitive-trigger-closure.test.mjs"
      - "tests/product-m1-workflow-offline-pr-capture-20261030.test.mjs"
      - ".github/workflows/m1-data-capture.yml"
      - "docs/M1_DATA_FEASIBILITY.md"
  workflow_dispatch:

concurrency:
  group: supa-m1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify permanent VPS runner
        run: |
          test "$(hostname -s)" = "vps-bb300bba"
          echo "runner=$(hostname -s)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify bounded source contract
        run: npm test

      - name: Run matching benchmark
        run: npm run m1:matching-benchmark

      - name: Capture representative public pages
        # Pull requests must never initiate live supermarket traffic, even
        # if their branch contains a forged source-permission JSON document.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        id: capture
        continue-on-error: true
        run: node scripts/m1-capture-sources.mjs

      - name: Inspect capture integrity and structured data
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        id: inspect
        run: |
          capture_dir="$(find artifacts/m1-captures -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$capture_dir"
          npm run m1:inspect-captures -- "$capture_dir"

      - name: Evaluate capture freshness evidence
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        id: freshness
        run: |
          capture_dir="$(find artifacts/m1-captures -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$capture_dir"
          npm run m1:evaluate-freshness -- "$capture_dir"

      - name: Export sanitized product candidates
        id: export
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.inspect.outcome == 'success'
        run: |
          capture_dir="$(find artifacts/m1-captures -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$capture_dir"
          npm run m1:export-candidates -- "$capture_dir"

      - name: Build M1 evidence summary
        id: evidence
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.inspect.outcome == 'success' && steps.freshness.outcome == 'success' && steps.export.outcome == 'success'
        run: |
          capture_dir="$(find artifacts/m1-captures -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$capture_dir"
          npm run m1:evidence-summary -- "$capture_dir"

      - name: Upload capture evidence
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supa-m1-source-captures
          # Never publish raw .html snapshots in Actions artifacts. Source
          # bytes remain owner-only on the authorized VPS for offline review.
          path: |
            artifacts/m1-captures/**/manifest.json
            artifacts/m1-captures/**/inspection.json
            artifacts/m1-captures/**/freshness.json
            artifacts/m1-captures/**/evidence-summary.json
            artifacts/m1-captures/**/sanitized-candidates/index.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail visibly when capture evidence fails
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (steps.capture.outcome != 'success' || steps.inspect.outcome != 'success' || steps.freshness.outcome != 'success' || steps.export.outcome == 'failure' || steps.evidence.outcome == 'failure')
        run: |
          echo "M1 capture evidence failed. Inspect manifest.json, inspection.json, freshness.json, sanitized-candidates/index.json and evidence-summary.json in the uploaded artifact."
          exit 1
